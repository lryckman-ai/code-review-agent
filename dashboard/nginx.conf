# SPA host for the dashboard bundle.
#
# The ALB Ingress terminates routing: /api and /healthz go to the api Service,
# everything else lands here. So this server only needs to:
#   1. serve the static bundle with an SPA fallback to index.html
#   2. answer /healthz 200 — the ALB target group for THIS Service health-checks
#      that path (the Ingress sets one healthcheck-path for all target groups)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ALB target-group health check for the dashboard target group.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Hashed asset files — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routes — always serve index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
