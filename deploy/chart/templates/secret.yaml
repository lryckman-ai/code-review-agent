apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codereview.secretName" . }}
  labels:
    {{- include "codereview.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- if .Values.secrets.langsmithApiKey }}
  # Present => monitoring/tracing.py enables LangSmith; absent => no-op.
  LANGSMITH_API_KEY: {{ .Values.secrets.langsmithApiKey | quote }}
  {{- end }}
  # Absent => webhook.verify_signature() always returns False (endpoint
  # effectively disabled, GitHub gets a 401) rather than accepting anything.
  GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.githubWebhookSecret | quote }}
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
